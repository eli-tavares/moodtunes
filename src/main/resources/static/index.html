<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MoodTunes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Discover songs and albums that match how you feel.">
    <meta name="theme-color" content="#1e293b">

    <!-- Installable app (Android/desktop via the manifest, iPhone via the apple-* tags) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MoodTunes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="icon" href="/favicon/favicon.ico">

    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="app">
    <p id="boot" class="muted center" role="status">Opening…</p>

    <!-- Lock screen: shown before anything else whenever an access code is required -->
    <section id="lock" class="card" hidden aria-labelledby="lockTitle">
        <h1 id="lockTitle">🎶 MoodTunes</h1>
        <p class="muted">Enter your access code to continue.</p>
        <form id="lockForm">
            <!-- lets iOS Passwords / password managers save and autofill the code -->
            <input type="text" name="username" value="moodtunes" autocomplete="username"
                   class="sr-only" tabindex="-1" aria-hidden="true" readonly>
            <label for="tokenInput" class="sr-only">Access code</label>
            <input id="tokenInput" name="password" type="password" autocomplete="current-password"
                   autocapitalize="off" spellcheck="false" placeholder="Access code" required>
            <label class="check"><input id="rememberChk" type="checkbox" checked>
                Keep me unlocked on this device</label>
            <button id="unlockBtn" class="btn primary" type="submit">Unlock</button>
        </form>
        <p id="lockStatus" class="error-text" role="alert"></p>
    </section>

    <div id="appContent" hidden>
        <header class="top">
            <div>
                <h1>🎶 MoodTunes</h1>
                <p class="tagline">Tell me how you feel, pick the emotion that fits, and get song or album
                    recommendations tailored to your vibe.</p>
            </div>
            <button id="lockBtn" class="btn small" type="button" aria-label="Lock the app">🔒 Lock</button>
        </header>

        <section class="card" aria-labelledby="moodLabel">
            <label id="moodLabel" for="moodText">How are you feeling?</label>
            <textarea id="moodText" rows="4" maxlength="500" autocomplete="off"
                      placeholder="A few sentences about your mood…"></textarea>
            <button id="analyzeBtn" class="btn primary" type="button">Analyze</button>
        </section>

        <section id="emotionsCard" class="card" hidden aria-labelledby="emotionsTitle">
            <h2 id="emotionsTitle">Possible emotions</h2>
            <div id="emotionsContainer" class="chips" role="group" aria-label="Emotions"></div>
        </section>

        <section id="mediaCard" class="card" hidden aria-labelledby="mediaQuestion">
            <h2 id="mediaQuestion"></h2>
            <div class="row">
                <button id="songsBtn" class="btn" type="button">Songs</button>
                <button id="albumsBtn" class="btn" type="button">Albums</button>
            </div>
        </section>

        <section id="resultsCard" class="card" hidden aria-labelledby="resultsTitle">
            <h2 id="resultsTitle">Recommendations</h2>
            <ul id="resultsList" class="results"></ul>
        </section>

        <p id="status" role="status" aria-live="polite"></p>
    </div>
</main>

<script src="/app.js"></script>
</body>
</html>
